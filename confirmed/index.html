<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed - FibroPulse</title>
<style>
  :root { --bg:#f6f2fa; --card:#ffffff; --text:#231a2b; --muted:#5e5469; --accent:#5E3A78; --line:#e6dcee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14111b; --card:#1f1928; --text:#f1eaf6; --muted:#b9aec6; --accent:#b79ad0; --line:#3a2d4a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family: Roboto, "Helvetica Neue", Arial, sans-serif; line-height:1.6; }
  .card { max-width:420px; margin:16px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 12px; font-size:1.5rem; color:var(--accent); }
  p { margin:0 0 12px; }
  .muted { color:var(--muted); font-size:.95rem; }
  .tick { font-size:2.5rem; }
</style>
</head>
<body>
<div class="card">
  <div class="tick">&#10003;</div>
  <h1>Email confirmed</h1>
  <p>Thank you. Your email address has been confirmed.</p>
  <p>Go back to the FibroPulse app and sign in with your email and password.</p>
  <p class="muted">You can close this page.</p>
</div>
</body>
</html>
